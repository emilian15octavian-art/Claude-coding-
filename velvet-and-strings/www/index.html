<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120509">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: capacitor: https://localhost http://localhost; media-src 'self' data: blob: mediastream:;">
<title>Velvet &amp; Strings</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="top">
  <button class="ttl" id="topTtl"><h1 id="topTitle">Velvet &amp; Strings</h1><div class="meta" id="topMeta"></div></button>
  <button class="iconbtn" id="undoBtn" aria-label="Undo" title="Undo">&#8630;</button>
  <span class="pill" id="keyPill">Key</span>
</div>

<main>
  <!-- STYLES -->
  <section class="view" id="v-styles">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search artists, moods, eras" autocomplete="off"></label>
    <div class="chips" id="catChips"></div>
    <div class="chips" id="tempoChips" style="margin-top:4px"></div>
    <button class="inspire" id="inspireBtn"><i>&#10022;</i><div><b>Inspire me</b><span>A random style becomes a complete new song sketch</span></div></button>
    <div id="styleList"></div>
  </section>

  <!-- STUDIO -->
  <section class="view" id="v-studio">
    <div class="hero">
      <p class="vibe" id="vibe"></p>
      <details><summary>Studio secret &#9662;</summary><p id="secret"></p></details>
      <div class="chips secchips" id="secChips"></div>
      <div class="strip" id="strip"></div>
      <div class="actions" id="studioActions"></div>
    </div>
    <div class="seg" id="instSeg"></div>
    <div class="card inst" id="instPanel" style="margin-top:8px"></div>

    <div class="h"><h2>Sound</h2></div>
    <div class="card ctrl">
      <div class="row"><span class="small muted" style="width:50px">Tempo</span><input type="range" id="tempo" min="50" max="160" step="1"><span id="tempoVal" style="width:34px;text-align:right;font-weight:700;color:var(--gold2)"></span><button class="tog" id="tapBtn">Tap</button></div>
      <div><div class="lbl" style="margin-top:0">Groove</div><div class="chips wrap" id="grooveChips"></div></div>
      <div><div class="lbl" style="margin-top:0">Drums</div><div class="chips wrap" id="drumChips"></div></div>
      <div><div class="lbl" style="margin-top:0">Voices</div><div class="seg" id="voiceSeg"></div></div>
      <div class="togs"><button class="tog" id="swingTog">Swing</button><button class="tog" id="drumTog">Drums on</button><button class="tog" id="metroTog">Click</button><button class="tog" id="countTog">Count-in</button></div>
      <div class="row"><span class="small muted" style="width:50px">Volume</span><input type="range" id="vol" min="0" max="100"></div>
    </div>

    <div class="h"><h2>Instrument</h2></div>
    <div class="card ctrl">
      <div class="seg" id="instrSeg"></div>
      <div class="row"><select class="sel grow" id="tuningSel" aria-label="Tuning"></select>
        <div class="step"><button id="capoDn" aria-label="Capo down">&minus;</button><span id="capoVal">No capo</span><button id="capoUp" aria-label="Capo up">+</button></div></div>
      <div class="togs"><button class="tog" id="leftyTog">Left-handed</button></div>
    </div>
  </section>

  <!-- WRITE -->
  <section class="view" id="v-write">
    <input class="titlein" id="songTitle" placeholder="Untitled romance" maxlength="80">
    <div class="chips" id="statusChips" style="margin-top:10px"></div>
    <div class="row" style="margin:10px 0 4px;gap:8px">
      <button class="btn rose grow" id="playSongBtn">&#9654; Play whole song</button>
      <button class="btn" id="perfBtn">Stage</button>
      <button class="btn" id="formBtn">Form</button>
    </div>
    <div class="h"><h2>Structure</h2><span class="lnk small" id="secCount"></span></div>
    <div id="sections"></div>
    <div class="row" style="gap:8px">
      <select class="sel grow" id="addType" aria-label="Section type"></select>
      <button class="btn gold" id="addBtn">+ Add</button>
    </div>
    <div class="h"><h2>Rhyme &amp; imagery bank</h2><span class="lnk" id="lyricTipsLnk">Lyric tips</span></div>
    <div class="card">
      <button class="prompt" id="promptBox"></button>
      <div class="chips" id="rhymeChips" style="margin-top:10px"></div>
      <div class="rhymes" id="rhymeWords"></div>
      <p class="tiny muted" style="margin:8px 0 0">Tap a word to add it to the lyrics you last edited. Tap the prompt for a new image.</p>
    </div>
  </section>

  <!-- LEARN -->
  <section class="view" id="v-learn">
    <div class="chips" id="learnTabs" style="margin-top:4px"></div>
    <div id="learnBody" style="margin-top:10px"></div>
  </section>

  <!-- LIBRARY -->
  <section class="view" id="v-library">
    <div class="card goal" id="goalCard"></div>
    <div class="grid3">
      <button class="btn gold" id="quickBtn">&#9889; Sketch</button>
      <button class="btn" id="challengeBtn">&#127922; Challenge</button>
      <button class="btn" id="newBtn">+ New</button>
    </div>
    <label class="search" style="margin-top:12px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="libQ" type="search" placeholder="Search songs, tags, lyrics" autocomplete="off"></label>
    <div class="chips" id="libFilter"></div>
    <div class="h"><h2>Songs</h2><span class="small muted" id="songCount"></span></div>
    <div id="songList"></div>
    <div class="h"><h2>Idea inbox · voice memos</h2><span class="small muted" id="memoCount"></span></div>
    <div id="memoList"></div>
    <div class="h"><h2>Data</h2></div>
    <div class="grid2">
      <button class="btn" id="backupBtn">Back up all</button>
      <button class="btn" id="restoreBtn">Restore</button>
      <button class="btn" id="batchBtn">Export all (ChordPro)</button>
      <button class="btn" id="aboutBtn">About</button>
    </div>
    <input type="file" id="restoreFile" accept="application/json,.json,text/plain" hidden>
  </section>
</main>

<div class="dock">
  <button class="play" id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4l13 8-13 8z"/></svg></button>
  <div class="now"><b id="nowChord">–</b><span id="nowSub">Loop</span></div>
  <button class="cue" id="cueBtn">&#9835; Cue</button>
  <button class="rec" id="recBtn" aria-label="Record voice memo"><i></i></button>
</div>
<nav class="tabs" id="tabs">
  <button data-v="styles"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Styles</button>
  <button data-v="studio"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Studio</button>
  <button data-v="write"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Write</button>
  <button data-v="learn"><svg viewBox="0 0 24 24"><path d="M3 8l9-4 9 4-9 4z"/><path d="M7 10v5c3 2 7 2 10 0v-5"/></svg>Learn</button>
  <button data-v="library"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Library</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="perf" id="perf">
  <div class="bar"><button class="ib" id="perfClose" aria-label="Close">&#10005;</button><b id="perfTitle"></b>
    <button class="tog" id="perfSmaller">A&minus;</button><button class="tog" id="perfBigger">A+</button><button class="tog" id="perfScroll">Scroll</button></div>
  <div class="body" id="perfBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="js/theory.js"></script>
<script src="js/data.js"></script>
<script src="js/composer.js"></script>
<script src="js/export.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/learn.js"></script>
</body>
</html>
